name: Submit to App Store

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_number:
        description: "빌드 번호 (비워두면 GitHub run number 사용)"
        required: false
        type: string

concurrency:
  group: cd-release
  cancel-in-progress: false

jobs:
  release:
    name: App Store 제출
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Create Secrets.xcconfig
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          mkdir -p XCConfig
          cat > XCConfig/Secrets.xcconfig << EOF
          AMPLITUDE_API_KEY = ${AMPLITUDE_API_KEY}
          BASE_URL = ${BASE_URL}
          CLARITY_PROJECT_ID = ${CLARITY_PROJECT_ID}
          DEVELOPMENT_TEAM = ${DEVELOPMENT_TEAM}
          EOF

      - name: Convert API Key (PKCS#8 → EC 형식)
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > /tmp/AuthKey_raw.p8
          /opt/homebrew/opt/openssl@3/bin/openssl pkey -traditional \
            -in /tmp/AuthKey_raw.p8 -out /tmp/AuthKey.p8
          mkdir -p ~/.appstoreconnect/private_keys
          cp /tmp/AuthKey_raw.p8 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Install Tuist
        run: curl -Ls https://install.tuist.io | bash

      - name: Tuist install
        run: tuist install

      - name: Tuist generate
        run: tuist generate --no-open

      - name: Submit to App Store
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          DEVELOPER_PORTAL_TEAM_ID: ${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: bundle exec fastlane release
