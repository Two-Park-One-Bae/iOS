name: PR Review Request Notify

on:
  pull_request:
    types: [review_requested]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord mention notification
        run: |
          # ── GitHub username → Discord 숫자 ID 매핑 ──
          declare -A USER_MAP
          USER_MAP["taew0o"]="618377538758246410"
          USER_MAP["ParkMazorika"]="267170642313478144"
          USER_MAP["byb0823"]="790070051482763275"

          # ── 리뷰 요청받은 사람 ──
          REVIEWER="${{ github.event.requested_reviewer.login }}"
          DISCORD_ID="${USER_MAP[$REVIEWER]}"

          # ── PR 정보 ──
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          REPO_NAME="${{ github.event.repository.name }}"

          # ── 멘션 처리 (매핑 없으면 GitHub 이름만 표시) ──
          if [ -n "$DISCORD_ID" ]; then
            MENTION="<@${DISCORD_ID}>"
          else
            MENTION="@${REVIEWER}"
          fi

          # ── 메시지 전송 ──
          curl -H "Content-Type: application/json" \
            -d "{
              \"content\": \"${MENTION} 님, 리뷰 요청이 도착했어요! 👀\",
              \"embeds\": [{
                \"title\": \"${PR_TITLE}\",
                \"url\": \"${PR_URL}\",
                \"description\": \"**저장소:** ${REPO_NAME}\n**작성자:** ${PR_AUTHOR}\",
                \"color\": 5814783
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK }}"
