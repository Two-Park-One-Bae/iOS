name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler: "latest"
          bundler-cache: true

      - name: Create Secrets.xcconfig
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          mkdir -p XCConfig
          cat > XCConfig/Secrets.xcconfig << EOF
          AMPLITUDE_API_KEY = ${AMPLITUDE_API_KEY}
          BASE_URL = ${BASE_URL}
          CLARITY_PROJECT_ID = ${CLARITY_PROJECT_ID}
          DEVELOPMENT_TEAM = ${DEVELOPMENT_TEAM}
          EOF

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > Projects/App/Resources/GoogleService-Info.plist

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.tuist/Cache
          key: ${{ runner.os }}-spm-${{ hashFiles('Tuist/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Swift Packages
        run: tuist install

      - name: Tuist generate
        run: tuist generate --no-open

      - name: Boot Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 16" | grep -v "Plus\|Pro" | head -1 | grep -oE '[A-F0-9-]{36}')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run tests
        run: bundle exec fastlane test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: fastlane/test_output/
