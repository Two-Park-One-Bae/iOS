name: Deploy to TestFlight (Internal)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: cd-internal
  cancel-in-progress: false

jobs:
  beta_internal:
    name: TestFlight 내부 테스트 배포
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "latest"
          bundler-cache: true

      - name: Create Secrets.xcconfig
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          mkdir -p XCConfig
          # xcconfig 은 값 안의 "//" 를 주석 처리하므로 스킴의 "://" 에 $() 를 끼워 회피.
          # (이미 회피형이면 "://" 가 없어 그대로 통과 — 멱등)
          BASE_URL_ESC=$(printf '%s' "${BASE_URL}" | sed 's#://#:/$()/#')
          cat > XCConfig/Secrets.xcconfig << EOF
          AMPLITUDE_API_KEY = ${AMPLITUDE_API_KEY}
          BASE_URL_DEBUG = ${BASE_URL_ESC}
          BASE_URL_RELEASE = ${BASE_URL_ESC}
          CLARITY_PROJECT_ID = ${CLARITY_PROJECT_ID}
          DEVELOPMENT_TEAM = ${DEVELOPMENT_TEAM}
          EOF

      - name: Debug Secrets (safe — 값 노출 없이 길이만)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          echo "secret BASE_URL 길이(env): ${#BASE_URL}"
          echo "=== Secrets.xcconfig 각 줄 값 길이(값 미노출) ==="
          awk -F' = ' '{ v=$2; gsub(/^ +| +$/,"",v); print $1 " -> len=" length(v) }' XCConfig/Secrets.xcconfig

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > Projects/App/Resources/GoogleService-Info.plist

      - name: Write API Key
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > /tmp/AuthKey_raw.p8
          OPENSSL=$(brew --prefix openssl@3)/bin/openssl
          $OPENSSL pkey -traditional -in /tmp/AuthKey_raw.p8 -out /tmp/AuthKey.p8
          mkdir -p ~/.appstoreconnect/private_keys
          cp /tmp/AuthKey_raw.p8 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.tuist/Cache
          key: ${{ runner.os }}-spm-${{ hashFiles('Tuist/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Swift Packages
        run: tuist install

      - name: Tuist generate
        run: tuist generate --no-open

      - name: Debug resolved BASE_URL (safe — 길이만)
        run: |
          LEN=$(xcodebuild -workspace Application.xcworkspace -scheme App -configuration Release -showBuildSettings 2>/dev/null \
            | awk -F'= ' '/ BASE_URL =/{ gsub(/ /,"",$2); print length($2); exit }')
          echo "Release 구성 최종 해석 BASE_URL 길이: ${LEN:-0}"

      - name: Deploy to TestFlight (Internal)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta_internal
